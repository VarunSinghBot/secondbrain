packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - vite@6.4.2 || 6.4.3
  - '@hono/node-server@1.19.13 || 1.19.15'
  - sharp@0.35.0
  - next@15.5.21
  - nanoid@3.3.18
  - deepmerge-ts@8.0.0

# Moved from the root package.json's "pnpm" field — pnpm 11.x no longer
# reads pnpm.overrides there (see the "field is no longer read" warning
# it prints otherwise), so these were silently inert until moved here.
overrides:
  postcss: 8.5.23
  nanoid: 3.3.18
  "@auth/core": 0.41.3
  js-yaml: 4.3.1
  brace-expansion: 1.1.18
  fast-uri: 3.1.5
  valibot: 1.4.2
  tar: 7.5.21
  hono: 4.12.34
  "@hono/node-server": 1.19.15
  sharp: 0.35.0
  deepmerge-ts: 8.0.0
