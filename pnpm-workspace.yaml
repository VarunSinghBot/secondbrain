packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - vite@6.4.2 || 6.4.3
  - '@hono/node-server@1.19.13 || 1.19.15'
  - sharp@0.35.0
  - next@15.5.21
  - nanoid@3.3.18
  - deepmerge-ts@8.0.0

# Moved from the root package.json's "pnpm" field — pnpm 11.x no longer
# reads pnpm.overrides there (see the "field is no longer read" warning
# it prints otherwise), so these were silently inert until moved here.
overrides:
  postcss: 8.5.23
  nanoid: 3.3.18
  "@auth/core": 0.41.3
  js-yaml: 4.3.1
  brace-expansion: 1.1.18
  fast-uri: 3.1.5
  valibot: 1.4.2
  tar: 7.5.21
  hono: 4.12.34
  "@hono/node-server": 1.19.15
  sharp: 0.35.0
  deepmerge-ts: 8.0.0
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g (browserslist, high) and
  # GHSA-3f6p-5ww8-9rcr (mysql2, high) — confirmed via live pnpm audit.
  # browserslist comes transitively via autoprefixer (web's CSS build
  # tooling); mysql2 comes transitively via prisma bundling multi-driver
  # support this app never uses (Postgres-only). Neither is a direct
  # dependency of anything here, hence the override rather than a normal
  # version bump.
  browserslist: 4.28.7
  mysql2: 3.22.0
