version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: secondbrain-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  clip-sidecar:
    build:
      context: ./clip-sidecar
      dockerfile: Dockerfile
    container_name: secondbrain-clip-sidecar
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped

  rag-backend:
    build:
      context: .
      dockerfile: apps/rag-backend/Dockerfile
    container_name: secondbrain-rag-backend
    ports:
      - "3000:3000"
    environment:
      - RAG_BACKEND_PORT=3000
      - QDRANT_URL=http://qdrant:6333
      - CLIP_SIDECAR_URL=http://clip-sidecar:8001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - qdrant
      - clip-sidecar
    restart: unless-stopped

volumes:
  qdrant_storage:
