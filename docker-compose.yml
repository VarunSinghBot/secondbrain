version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: secondbrain-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Port is fixed via the Dockerfile's own `uvicorn ... --port 8001` CMD —
  # main.py never reads a PORT env var, so none is declared here to avoid
  # implying it's configurable this way.
  clip-sidecar:
    build:
      context: ./clip-sidecar
      dockerfile: Dockerfile
    container_name: secondbrain-clip-sidecar
    ports:
      - "8001:8001"
    restart: unless-stopped

  # apps/rag-backend, apps/web, and apps/chat-backend have no Dockerfiles and
  # aren't run via this compose file — they run directly (`pnpm dev`/`pnpm
  # build`, see the root README's Setup & run) against the services below.
  # This file only provisions the two dependencies that benefit from being
  # containerized locally: the vector database and the CLIP sidecar.

volumes:
  qdrant_storage:
